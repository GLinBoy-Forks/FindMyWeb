[jwt]
secret = "REPLACE WITH A SECURE KEY"
expire = 30                          # in minutes

secret_refresh = "REPLACE WITH A SECURE KEY"
expire_refresh = 48                          # in hours

algorithm = "HS256"

[admin]
name = "REPLACE WITH ADMIN USERNAME"
password = "REPLACE WITH A SECURE KEY"

[findmy]
account = "ACCOUNT CONFIG PATH"
libs_path = "ANISETTE LIBRARY PATH"

[db]
uri = "sqlite://REPLACE WITH DB PATH"

[frontend]
path = "REPLACE WITH DIST FOLDER PATH FROM FRONTEND"


